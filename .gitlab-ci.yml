stages: 
  - deploy

deploy-boutique: 
  image: python:3.12-bookworm
  stage: deploy
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - apt-get update -y && apt-get install -y curl unzip
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - pip3 install boto3
  script: 
    - python3 deploy.py
  only: 
    refs: 
      - main